server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 240s;
        # SSE-поток статусов генерации (/api/games/{id}/events) не должен буферизоваться
        proxy_buffering off;
    }

    location /g/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # общая ссылка эксперимента: вариант выбирается на сервере, кэшировать нельзя
    location /e/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /healthz {
        proxy_pass http://api:8080;
    }

    location / {
        try_files $uri /index.html;
    }
}
