services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: beeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beeline}
      POSTGRES_DB: beeline
    command: postgres -c synchronous_commit=off -c shared_buffers=256MB
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1: проверка по TCP. При первом запуске образ поднимает временный сервер
      # только на unix-сокете — без -h он «здоров» раньше, чем база принимает соединения.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U beeline -d beeline"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrator:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - -path=/migrations
      - -database=postgres://beeline:${POSTGRES_PASSWORD:-beeline}@db:5432/beeline?sslmode=disable
      - up
    restart: "no"

  # headless Chrome: агент запускает в нём сгенерированные игры и проверяет, что они работают
  browser:
    image: chromedp/headless-shell:latest
    restart: unless-stopped
    shm_size: 512m
    expose:
      - "9222"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      browser:
        condition: service_started
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://beeline:${POSTGRES_PASSWORD:-beeline}@db:5432/beeline?sslmode=disable
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?задайте OPENROUTER_API_KEY в .env}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-haiku-5.5}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      LLM_PLANNER_MODEL: ${LLM_PLANNER_MODEL:-deepseek/deepseek-v4.1-flash}
      LLM_FIXER_MODEL: ${LLM_FIXER_MODEL:-}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-deepseek/deepseek-v4-pro}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-32000}
      MAX_FIX_ROUNDS: ${MAX_FIX_ROUNDS:-2}
      BROWSER_WS_URL: ${BROWSER_WS_URL:-ws://browser:9222}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      MANAGER_CODE: ${MANAGER_CODE:-}
      MAX_CONCURRENT_GEN: ${MAX_CONCURRENT_GEN:-8}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-240}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pgdata:
