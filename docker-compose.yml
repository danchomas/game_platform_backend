services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: beeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beeline}
      POSTGRES_DB: beeline
    command: postgres -c synchronous_commit=off -c shared_buffers=256MB
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beeline -d beeline"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrator:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - -path=/migrations
      - -database=postgres://beeline:${POSTGRES_PASSWORD:-beeline}@db:5432/beeline?sslmode=disable
      - up
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://beeline:${POSTGRES_PASSWORD:-beeline}@db:5432/beeline?sslmode=disable
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?задайте OPENROUTER_API_KEY в .env}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4.5}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      MANAGER_CODE: ${MANAGER_CODE:-}
      MAX_CONCURRENT_GEN: ${MAX_CONCURRENT_GEN:-8}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-180}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pgdata:
